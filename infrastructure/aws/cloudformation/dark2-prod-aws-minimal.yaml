AWSTemplateFormatVersion: '2010-09-09'
Description: 'dARK minimal AWS smoke profile: VPC, ALB, one apps host, retained data EBS and host bootstrap.'

Parameters:
  DeploymentName: {Type: String, Default: dark2-prod-aws, AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'}
  ResourceNamePrefix: {Type: String, Default: dark-prod-, AllowedPattern: '^[a-z][a-z0-9-]{2,39}-$'}
  Environment: {Type: String, Default: production, AllowedValues: [production, staging]}
  VpcCidr: {Type: String, Default: 10.20.0.0/16}
  AlbSubnetCidr: {Type: String, Default: 10.20.0.0/24}
  WorkloadSubnetCidr: {Type: String, Default: 10.20.10.0/24}
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  KeyName: {Type: AWS::EC2::KeyPair::KeyName, Default: lareferencia-dark}
  DeployUser: {Type: String, Default: ubuntu, AllowedPattern: '^[a-z_][a-z0-9_-]{0,31}$'}
  AppsInstanceType: {Type: String, Default: c7g.2xlarge}
  ResolverInstanceType: {Type: String, Default: c7g.large}
  BlockchainInstanceType: {Type: String, Default: c7g.xlarge}
  StorageInstanceType: {Type: String, Default: c7g.large}
  AppsDataVolumeGiB: {Type: Number, Default: 120, MinValue: 20}
  ResolverDataVolumeGiB: {Type: Number, Default: 60, MinValue: 20}
  BlockchainDataVolumeGiB: {Type: Number, Default: 120, MinValue: 40}
  StorageDataVolumeGiB: {Type: Number, Default: 250, MinValue: 100}
  AppsHostname: {Type: String, AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$'}
  ResolverHostname: {Type: String, AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$'}
  AcmCertificateArn: {Type: String}
  HostedZoneId: {Type: String}
  EnableDeletionProtection: {Type: String, Default: 'true', AllowedValues: ['true', 'false']}
  RetainDataVolumes: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}

Conditions:
  RetainDataVolumesCondition: !Equals [!Ref RetainDataVolumes, 'true']
  DeleteDataVolumesCondition: !Equals [!Ref RetainDataVolumes, 'false']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}minimal-vpc'}, {Key: dARKProfile, Value: minimal}]
  InternetGateway: {Type: AWS::EC2::InternetGateway}
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {InternetGatewayId: !Ref InternetGateway, VpcId: !Ref Vpc}
  AlbSubnet:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, AvailabilityZone: !Select [1, !GetAZs ''], CidrBlock: !Ref AlbSubnetCidr, MapPublicIpOnLaunch: true}
  WorkloadSubnet:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, AvailabilityZone: !Select [0, !GetAZs ''], CidrBlock: !Ref WorkloadSubnetCidr, MapPublicIpOnLaunch: true}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  AlbSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref AlbSubnet}
  WorkloadSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref WorkloadSubnet}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore']
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  MeshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private dARK mesh for the minimal apps host.
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: 'Package, image, and external service egress'}]
  MeshSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref MeshSecurityGroup, IpProtocol: '-1', SourceSecurityGroupId: !Ref MeshSecurityGroup, Description: Private mesh traffic only}
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS entrypoint for the minimal Minter gateway.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP gateway}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS gateway}
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
  GatewayTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Receives proxy HTTP only from the minimal ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: ALB to apps proxy}]
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]

  AppsDataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref AppsDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}minimal-apps-data'}]}
  AppsDataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref AppsDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}minimal-apps-data'}]}
  DarkHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ResourceNamePrefix}minimal-host-bootstrap'
      LaunchTemplateData:
        ImageId: !Ref ImageId
        KeyName: !Ref KeyName
        IamInstanceProfile: {Name: !Ref InstanceProfile}
        TagSpecifications:
          - ResourceType: volume
            Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}root'}]
        MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1, InstanceMetadataTags: disabled}
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 30, DeleteOnTermination: true}}]
        UserData: !Base64
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            deploy_user='${DeployUser}'
            retry() { local attempt=1; until "$@"; do [ "$attempt" -ge 5 ] && return 1; attempt=$((attempt + 1)); sleep 5; done; }
            rm -f /var/lib/dark/bootstrap-complete
            id -u "$deploy_user" >/dev/null 2>&1 || useradd --create-home --shell /bin/bash "$deploy_user"
            retry apt-get update
            retry apt-get install -y ca-certificates curl gnupg lsb-release snapd docker.io docker-compose-v2
            if ! systemctl is-active --quiet amazon-ssm-agent.service && ! systemctl is-active --quiet snap.amazon-ssm-agent.amazon-ssm-agent.service; then snap install amazon-ssm-agent --classic; fi
            systemctl enable --now amazon-ssm-agent.service 2>/dev/null || systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service
            if ! command -v tailscale >/dev/null 2>&1; then curl -fsSL https://tailscale.com/install.sh | sh; fi
            systemctl enable --now tailscaled.service
            systemctl disable --now docker.service docker.socket || true
            root_source="$(findmnt -n -o SOURCE /)"
            root_disk="$(lsblk -no PKNAME "$root_source" 2>/dev/null | head -n1 || true)"
            [ -n "$root_disk" ] || root_disk="$(basename "$root_source" | sed 's/p[0-9][0-9]*$//')"
            find_data_device() { local name kind; while read -r name kind; do [ "$kind" = disk ] || continue; [ "$name" = "$root_disk" ] && continue; printf '/dev/%s\n' "$name"; return 0; done < <(lsblk -dn -o NAME,TYPE); return 1; }
            data_device=''
            for attempt in $(seq 1 180); do data_device="$(find_data_device || true)"; [ -b "$data_device" ] && break; sleep 2; done
            [ -b "$data_device" ] || { echo 'data volume not attached' >&2; exit 1; }
            blkid "$data_device" >/dev/null 2>&1 || mkfs.ext4 -F "$data_device"
            install -d -m 0750 /srv/dark/data
            uuid="$(blkid -s UUID -o value "$data_device")"
            grep -qsE '[[:space:]]/srv/dark/data[[:space:]]' /etc/fstab || echo "UUID=$uuid /srv/dark/data ext4 defaults,nofail,x-systemd.device-timeout=10s 0 2" >> /etc/fstab
            mountpoint -q /srv/dark/data || mount /srv/dark/data
            install -d -m 0750 -o "$deploy_user" -g "$deploy_user" /srv/dark/data
            install -d -m 0710 -o root -g root /srv/dark/data/docker
            usermod -aG docker "$deploy_user"
            install -d -m 0755 /etc/docker /etc/systemd/system/docker.service.d
            cat >/etc/docker/daemon.json <<'EOF'
            {"data-root":"/srv/dark/data/docker","log-driver":"local","log-opts":{"max-size":"50m","max-file":"5"}}
            EOF
            cat >/etc/systemd/system/docker.service.d/dark-data.conf <<'EOF'
            [Unit]
            RequiresMountsFor=/srv/dark/data
            After=local-fs.target
            EOF
            systemctl daemon-reload
            systemctl enable --now docker.service
            docker info --format '{{.DockerRootDir}}' | grep -Fx /srv/dark/data/docker
            docker compose version
            systemctl is-active --quiet tailscaled.service

            install -d -m 0755 /var/lib/dark
            printf 'dark-bootstrap complete version=1 host=%s date=%s\n' "$(hostname -s)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /var/lib/dark/bootstrap-complete
  Apps:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref AppsInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.10
      SecurityGroupIds: [!Ref MeshSecurityGroup, !Ref GatewayTargetSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}minimal-apps'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: apps}, {Key: dARKProfile, Value: minimal}]
  AppsVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Apps, VolumeId: !If [RetainDataVolumesCondition, !Ref AppsDataVolumeRetained, !Ref AppsDataVolumeDelete]}

  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref AlbSubnet, !Ref WorkloadSubnet]
      LoadBalancerAttributes: [{Key: deletion_protection.enabled, Value: !Ref EnableDeletionProtection}]
  AppsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      Matcher: {HttpCode: '200-499'}
      Targets: [{Id: !Ref Apps, Port: 80}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties: {LoadBalancerArn: !Ref PublicAlb, Port: 80, Protocol: HTTP, DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties: {LoadBalancerArn: !Ref PublicAlb, Port: 443, Protocol: HTTPS, Certificates: [{CertificateArn: !Ref AcmCertificateArn}], DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]}
  AppsHttpHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: {ListenerArn: !Ref HttpListener, Priority: 10, Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref AppsHostname]}}], Actions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]}
  AppsHttpsHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: {ListenerArn: !Ref HttpsListener, Priority: 10, Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref AppsHostname]}}], Actions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]}
  AppsDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppsHostname
      Type: A
      AliasTarget: {DNSName: !GetAtt PublicAlb.DNSName, HostedZoneId: !GetAtt PublicAlb.CanonicalHostedZoneID}

Outputs:
  VpcId: {Value: !Ref Vpc}
  WorkloadSubnetId: {Value: !Ref WorkloadSubnet}
  AlbDnsName: {Value: !GetAtt PublicAlb.DNSName}
  AppsPrivateIp: {Value: !GetAtt Apps.PrivateIp}
  AppsPublicIp: {Value: !GetAtt Apps.PublicIp}
  AppsDataVolumeId: {Value: !If [RetainDataVolumesCondition, !Ref AppsDataVolumeRetained, !Ref AppsDataVolumeDelete]}
  AppsHttpUrl: {Value: !Sub 'http://${AppsHostname}'}
  AppsHttpsUrl: {Value: !Sub 'https://${AppsHostname}'}
