AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  dARK active six-host site. Creates an isolated VPC, an ALB subnet and one
  public workload subnet, six EC2 instances with dynamic public IPv4,
  encrypted persistent EBS volumes, role-scoped security groups, SSM access,
  and an ACM-backed public ALB with Route 53 aliases.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcCidr, AlbSubnetCidr, WorkloadSubnetCidr]
      - Label: {default: EC2 image and access}
        Parameters: [ImageId, KeyName, DeployUser, AppsInstanceType, ResolverInstanceType, BlockchainInstanceType, StorageInstanceType]
      - Label: {default: Persistent storage}
        Parameters: [AppsDataVolumeGiB, ResolverDataVolumeGiB, BlockchainDataVolumeGiB, StorageDataVolumeGiB, RetainDataVolumes]
      - Label: {default: Public gateways}
        Parameters: [AppsHostname, ResolverHostname, AcmCertificateArn, HostedZoneId]
      - Label: {default: Tags and safeguards}
        Parameters: [DeploymentName, ResourceNamePrefix, Environment, EnableDeletionProtection]

Parameters:
  DeploymentName:
    Type: String
    Default: dark2-prod-aws
    AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'
    Description: Lowercase identifier used in resource names and tags.
  ResourceNamePrefix:
    Type: String
    Default: dark-prod-
    AllowedPattern: '^[a-z][a-z0-9-]{2,39}-$'
    Description: Prefix for the Name tag of created resources; must end with a hyphen.
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  AlbSubnetCidr:
    Type: String
    Default: 10.20.0.0/24
  WorkloadSubnetCidr:
    Type: String
    Default: 10.20.10.0/24
    Description: Public, single-AZ subnet holding the six dARK hosts.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 26.04 LTS ARM64 AMI SSM parameter or a compatible AMI ID.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: lareferencia-dark
    Description: EC2 key pair for private or emergency SSH access; port 22 is not public.
  DeployUser:
    Type: String
    Default: ubuntu
    AllowedPattern: '^[a-z_][a-z0-9_-]{0,31}$'
    Description: Ubuntu Linux user used by the operator inventory and deployer; the bootstrap creates it only if absent.
  AppsInstanceType:
    Type: String
    Default: c7g.2xlarge
  ResolverInstanceType:
    Type: String
    Default: c7g.large
  BlockchainInstanceType:
    Type: String
    Default: c7g.xlarge
  StorageInstanceType:
    Type: String
    Default: c7g.large
  AppsDataVolumeGiB:
    Type: Number
    Default: 120
    MinValue: 20
  ResolverDataVolumeGiB:
    Type: Number
    Default: 60
    MinValue: 20
  BlockchainDataVolumeGiB:
    Type: Number
    Default: 120
    MinValue: 40
  StorageDataVolumeGiB:
    Type: Number
    Default: 250
    MinValue: 100
  AppsHostname:
    Type: String
    Description: Public DNS hostname for Minter, for example minter-01.dark-pid.net.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$'
  ResolverHostname:
    Type: String
    Description: Public DNS hostname for Resolver, for example resolver-01.dark-pid.net.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$'
  AcmCertificateArn:
    Type: String
    Description: Regional ACM certificate ARN covering both public hostnames.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted-zone ID where Rain creates or updates the ALB aliases.
  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  RetainDataVolumes:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Retain data EBS volumes when the stack is deleted.

Conditions:
  RetainDataVolumesCondition: !Equals [!Ref RetainDataVolumes, 'true']
  DeleteDataVolumesCondition: !Equals [!Ref RetainDataVolumes, 'false']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}vpc'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: Environment, Value: !Ref Environment}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}igw'}]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {InternetGatewayId: !Ref InternetGateway, VpcId: !Ref Vpc}
  AlbSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref AlbSubnetCidr
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}public-a'}]
  WorkloadSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref WorkloadSubnetCidr
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}workload-a'}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}public'}]}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  AlbSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref AlbSubnet}
  WorkloadSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref WorkloadSubnet}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Tags: [{Key: dARKDeployment, Value: !Ref DeploymentName}]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  MeshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private dARK service mesh derived from the six-host rendered firewall suggestion.
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: 'Package, image, and external service egress'}]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}mesh'}]
  MeshSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MeshSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref MeshSecurityGroup
      Description: All private TCP and UDP traffic, including SSH, only between dARK hosts.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS entrypoint for dARK gateways.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP gateway}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS gateway}
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}alb'}]
  GatewayTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Accepts proxy HTTP only from the public ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: ALB to edge proxy}]
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}gateway-target'}]

  AppsDataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref AppsDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}apps-data'}]}
  AppsDataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref AppsDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}apps-data'}]}
  ResolverDataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref ResolverDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}resolver-data'}]}
  ResolverDataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref ResolverDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}resolver-data'}]}
  BlockchainADataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref BlockchainDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-a-data'}]}
  BlockchainADataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref BlockchainDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-a-data'}]}
  BlockchainBDataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref BlockchainDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-b-data'}]}
  BlockchainBDataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref BlockchainDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-b-data'}]}
  Storage1DataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref StorageDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-1-data'}]}
  Storage1DataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref StorageDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-1-data'}]}
  Storage2DataVolumeRetained:
    Type: AWS::EC2::Volume
    Condition: RetainDataVolumesCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref StorageDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-2-data'}]}
  Storage2DataVolumeDelete:
    Type: AWS::EC2::Volume
    Condition: DeleteDataVolumesCondition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone, Encrypted: true, VolumeType: gp3, Size: !Ref StorageDataVolumeGiB, Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-2-data'}]}

  DarkHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ResourceNamePrefix}host-bootstrap'
      LaunchTemplateData:
        ImageId: !Ref ImageId
        KeyName: !Ref KeyName
        IamInstanceProfile: {Name: !Ref InstanceProfile}
        TagSpecifications:
          - ResourceType: volume
            Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}root'}]
        MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1, InstanceMetadataTags: disabled}
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 30, DeleteOnTermination: true}}]
        UserData: !Base64
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            deploy_user='${DeployUser}'

            retry() {
              local attempt=1
              until "$@"; do
                [ "$attempt" -ge 5 ] && return 1
                attempt=$((attempt + 1)); sleep 5
              done
            }

            rm -f /var/lib/dark/bootstrap-complete
            id -u "$deploy_user" >/dev/null 2>&1 || useradd --create-home --shell /bin/bash "$deploy_user"
            retry apt-get update
            retry apt-get install -y ca-certificates curl gnupg lsb-release snapd docker.io docker-compose-v2 python3.14-venv

            if ! systemctl is-active --quiet amazon-ssm-agent.service && ! systemctl is-active --quiet snap.amazon-ssm-agent.amazon-ssm-agent.service; then
              snap install amazon-ssm-agent --classic
            fi
            systemctl enable --now amazon-ssm-agent.service 2>/dev/null || systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service

            if ! command -v tailscale >/dev/null 2>&1; then
              curl -fsSL https://tailscale.com/install.sh | sh
            fi
            systemctl enable --now tailscaled.service

            systemctl disable --now docker.service docker.socket || true
            root_source="$(findmnt -n -o SOURCE /)"
            root_disk="$(lsblk -no PKNAME "$root_source" 2>/dev/null | head -n1 || true)"
            [ -n "$root_disk" ] || root_disk="$(basename "$root_source" | sed 's/p[0-9][0-9]*$//')"
            find_data_device() {
              local name kind
              while read -r name kind; do
                [ "$kind" = disk ] || continue
                [ "$name" = "$root_disk" ] && continue
                printf '/dev/%s\n' "$name"
                return 0
              done < <(lsblk -dn -o NAME,TYPE)
              return 1
            }
            data_device=''
            for attempt in $(seq 1 180); do
              data_device="$(find_data_device || true)"
              [ -b "$data_device" ] && break
              sleep 2
            done
            [ -b "$data_device" ] || { echo 'data volume not attached' >&2; exit 1; }
            blkid "$data_device" >/dev/null 2>&1 || mkfs.ext4 -F "$data_device"
            install -d -m 0755 -o "$deploy_user" -g "$deploy_user" /srv/dark
            install -d -m 0750 -o "$deploy_user" -g "$deploy_user" /srv/dark/data
            install -d -m 0700 -o "$deploy_user" -g "$deploy_user" /srv/dark/secrets
            uuid="$(blkid -s UUID -o value "$data_device")"
            grep -qsE '[[:space:]]/srv/dark/data[[:space:]]' /etc/fstab || echo "UUID=$uuid /srv/dark/data ext4 defaults,nofail,x-systemd.device-timeout=10s 0 2" >> /etc/fstab
            mountpoint -q /srv/dark/data || mount /srv/dark/data
            install -d -m 0750 -o "$deploy_user" -g "$deploy_user" /srv/dark/data
            chown "$deploy_user:$deploy_user" /srv/dark/data
            install -d -m 0710 -o root -g root /srv/dark/data/docker
            # Docker's data-root does not move containerd snapshots on Ubuntu.
            # Relocate them before starting Docker so image layers never fill
            # the root volume.
            systemctl stop docker.service containerd.service 2>/dev/null || true
            if [ ! -L /var/lib/containerd ]; then
              if [ -e /srv/dark/data/containerd ]; then
                install -d -m 0710 -o root -g root /srv/dark/data/containerd
                [ ! -d /var/lib/containerd ] || cp -a /var/lib/containerd/. /srv/dark/data/containerd/
                rm -rf /var/lib/containerd
              else
                install -d -m 0710 -o root -g root /srv/dark/data
                if [ -d /var/lib/containerd ]; then
                  mv /var/lib/containerd /srv/dark/data/containerd
                else
                  install -d -m 0710 -o root -g root /srv/dark/data/containerd
                fi
              fi
              ln -s /srv/dark/data/containerd /var/lib/containerd
            fi
            usermod -aG docker "$deploy_user"

            install -d -m 0755 /etc/docker /etc/systemd/system/docker.service.d
            cat >/etc/docker/daemon.json <<'EOF'
            {
              "data-root": "/srv/dark/data/docker",
              "log-driver": "local",
              "log-opts": {"max-size": "50m", "max-file": "5"}
            }
            EOF
            cat >/etc/systemd/system/docker.service.d/dark-data.conf <<'EOF'
            [Unit]
            RequiresMountsFor=/srv/dark/data
            After=local-fs.target
            EOF
            systemctl daemon-reload
            systemctl enable --now docker.service
            docker info --format '{{.DockerRootDir}}' | grep -Fx /srv/dark/data/docker
            test "$(readlink -f /var/lib/containerd)" = /srv/dark/data/containerd
            docker compose version
            systemctl is-active --quiet tailscaled.service

            install -d -m 0755 /var/lib/dark
            printf 'dark-bootstrap complete version=1 host=%s date=%s\n' "$(hostname -s)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /var/lib/dark/bootstrap-complete
  Apps:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref AppsInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.10
      SecurityGroupIds: [!Ref MeshSecurityGroup, !Ref GatewayTargetSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}apps'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: apps}, {Key: Environment, Value: !Ref Environment}]
  Resolver:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref ResolverInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.11
      SecurityGroupIds: [!Ref MeshSecurityGroup, !Ref GatewayTargetSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}resolver'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: resolver}, {Key: Environment, Value: !Ref Environment}]
  BlockchainA:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref BlockchainInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.12
      SecurityGroupIds: [!Ref MeshSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-a'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: blockchain-a}, {Key: Environment, Value: !Ref Environment}]
  BlockchainB:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref BlockchainInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.13
      SecurityGroupIds: [!Ref MeshSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}blockchain-b'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: blockchain-b}, {Key: Environment, Value: !Ref Environment}]
  Storage1:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref StorageInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.14
      SecurityGroupIds: [!Ref MeshSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-1'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: storage-1}, {Key: Environment, Value: !Ref Environment}]
  Storage2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !GetAtt WorkloadSubnet.AvailabilityZone
      LaunchTemplate: {LaunchTemplateId: !Ref DarkHostLaunchTemplate, Version: !GetAtt DarkHostLaunchTemplate.LatestVersionNumber}
      InstanceType: !Ref StorageInstanceType
      SubnetId: !Ref WorkloadSubnet
      PrivateIpAddress: 10.20.10.15
      SecurityGroupIds: [!Ref MeshSecurityGroup]
      Tags: [{Key: Name, Value: !Sub '${ResourceNamePrefix}storage-2'}, {Key: dARKDeployment, Value: !Ref DeploymentName}, {Key: dARKRole, Value: storage-2}, {Key: Environment, Value: !Ref Environment}]

  AppsVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Apps, VolumeId: !If [RetainDataVolumesCondition, !Ref AppsDataVolumeRetained, !Ref AppsDataVolumeDelete]}
  ResolverVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Resolver, VolumeId: !If [RetainDataVolumesCondition, !Ref ResolverDataVolumeRetained, !Ref ResolverDataVolumeDelete]}
  BlockchainAVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref BlockchainA, VolumeId: !If [RetainDataVolumesCondition, !Ref BlockchainADataVolumeRetained, !Ref BlockchainADataVolumeDelete]}
  BlockchainBVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref BlockchainB, VolumeId: !If [RetainDataVolumesCondition, !Ref BlockchainBDataVolumeRetained, !Ref BlockchainBDataVolumeDelete]}
  Storage1VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Storage1, VolumeId: !If [RetainDataVolumesCondition, !Ref Storage1DataVolumeRetained, !Ref Storage1DataVolumeDelete]}
  Storage2VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Storage2, VolumeId: !If [RetainDataVolumesCondition, !Ref Storage2DataVolumeRetained, !Ref Storage2DataVolumeDelete]}

  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref AlbSubnet, !Ref WorkloadSubnet]
      LoadBalancerAttributes: [{Key: deletion_protection.enabled, Value: !Ref EnableDeletionProtection}, {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}]
      Tags: [{Key: Name, Value: !Sub '${DeploymentName}-public'}, {Key: dARKDeployment, Value: !Ref DeploymentName}]
  AppsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      Matcher: {HttpCode: '200-499'}
      Targets: [{Id: !Ref Apps, Port: 80}]
  ResolverTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health/live
      Matcher: {HttpCode: '200-499'}
      Targets: [{Id: !Ref Resolver, Port: 80}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref AcmCertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]
  AppsHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref AppsHostname]}}]
      Actions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]
  ResolverHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref ResolverHostname]}}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ResolverTargetGroup}]
  AppsHttpHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref AppsHostname]}}]
      Actions: [{Type: forward, TargetGroupArn: !Ref AppsTargetGroup}]
  ResolverHttpHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions: [{Field: host-header, HostHeaderConfig: {Values: [!Ref ResolverHostname]}}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ResolverTargetGroup}]
  AppsDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppsHostname
      Type: A
      AliasTarget: {DNSName: !GetAtt PublicAlb.DNSName, HostedZoneId: !GetAtt PublicAlb.CanonicalHostedZoneID}
  ResolverDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ResolverHostname
      Type: A
      AliasTarget: {DNSName: !GetAtt PublicAlb.DNSName, HostedZoneId: !GetAtt PublicAlb.CanonicalHostedZoneID}

Outputs:
  VpcId: {Value: !Ref Vpc}
  WorkloadSubnetId: {Value: !Ref WorkloadSubnet}
  AvailabilityZone: {Value: !GetAtt WorkloadSubnet.AvailabilityZone}
  AlbDnsName: {Value: !GetAtt PublicAlb.DNSName}
  AppsPrivateIp: {Value: !GetAtt Apps.PrivateIp}
  ResolverPrivateIp: {Value: !GetAtt Resolver.PrivateIp}
  BlockchainAPrivateIp: {Value: !GetAtt BlockchainA.PrivateIp}
  BlockchainBPrivateIp: {Value: !GetAtt BlockchainB.PrivateIp}
  Storage1PrivateIp: {Value: !GetAtt Storage1.PrivateIp}
  Storage2PrivateIp: {Value: !GetAtt Storage2.PrivateIp}
  AppsPublicIp: {Value: !GetAtt Apps.PublicIp}
  ResolverPublicIp: {Value: !GetAtt Resolver.PublicIp}
  BlockchainAPublicIp: {Value: !GetAtt BlockchainA.PublicIp}
  BlockchainBPublicIp: {Value: !GetAtt BlockchainB.PublicIp}
  Storage1PublicIp: {Value: !GetAtt Storage1.PublicIp}
  Storage2PublicIp: {Value: !GetAtt Storage2.PublicIp}
  MeshSecurityGroupId: {Value: !Ref MeshSecurityGroup}
  AlbSecurityGroupId: {Value: !Ref AlbSecurityGroup}
  AppsHttpUrl: {Value: !Sub 'http://${AppsHostname}', Description: HTTP origin for the apps-public proxy.}
  AppsHttpsUrl: {Value: !Sub 'https://${AppsHostname}', Description: HTTPS origin for the apps-public proxy.}
  ResolverHttpUrl: {Value: !Sub 'http://${ResolverHostname}', Description: HTTP origin for the resolver-public proxy.}
  ResolverHttpsUrl: {Value: !Sub 'https://${ResolverHostname}', Description: HTTPS origin for the resolver-public proxy.}
