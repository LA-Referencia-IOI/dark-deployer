name: ${DARK_COMPOSE_PROJECT:-dark-blockchain-production}

include:
  - ../blockchain/compose.yml
  - components/blockchain/explorer.yml

# Production hosts do not share Docker networks.  Each host gets one local
# bridge; Besu peer-to-peer traffic crosses the VPN through the advertised
# addresses in static-nodes.json.
networks:
  dark-apps:
    name: dark-host
    driver: bridge
    external: false
  dark-backbone:
    name: dark-host
    driver: bridge
    external: false
