name: ${DARK_COMPOSE_PROJECT:-dark-blockchain-b}

include:
  - ../blockchain/compose.yml

# Developer HA's second validator host.  The shared backbone simulates the
# private/VPN network; dark-bc-b-local represents this host's Docker network.
networks:
  dark-bc-b-local:
    name: dark-bc-b-local
    driver: bridge
    external: true
  dark-backbone:
    name: dark-backbone
    external: true
