[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webwizard"
version = "0.1.0"
description = "Local, read-only operator workbench for dARK deployment v3"
requires-python = ">=3.14,<3.15"
# The workbench keeps its own dependency list (mirrored in requirements.txt) so
# the deployer never has to install anything on its behalf.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jsonschema>=4.20",
]

[tool.setuptools]
packages = ["webwizard"]

[tool.setuptools.package-data]
webwizard = ["static/*"]
