name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run static checks
        run: ruff check .
      - name: Compile Python entry points
        run: python -m py_compile install.py pre-install.py restart.py stop.py clean.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify installer help
        run: python install.py --help
